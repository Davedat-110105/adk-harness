name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  distributions:
    name: Wheel and sdist installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build both distributions and check contents
        run: |
          python -m pip install build pytest pytest-asyncio uv "hatchling==1.32.0"
          python -m build
          python tests/check_distribution.py dist/*
      - name: Install the wheel and check the bundled plugin outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          from importlib.resources import files
          import adk_harness
          plugin = files("adk_harness").joinpath("plugins/antigravity/plugin.json")
          assert plugin.is_file()
          assert adk_harness.AntigravityIntegration
          print("wheel-native-assets-ok")
          PY
          adk-harness --help
          adk-harness doctor --help
      - name: Verify packed npm install and launcher behavior
        run: python -m pytest tests/installation -q

      - name: Build and test approval UI
        run: |
          npm ci --prefix ui/approval
          npm run build --prefix ui/approval
          npm test --prefix ui/approval -- --run

  base-install:
    name: Base install and retired surface check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the base package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import the supported package from a clean installation
        run: |
          python - <<'PY'
          import adk_harness
          assert adk_harness.TaskRequest
          assert adk_harness.AntigravityIntegration
          print("supported-imports-ok")
          PY

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install with development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Live tests require credentials and explicit opt-in.
      - name: Run the offline suite
        run: pytest -q

      - name: Say which tests did not run
        if: always()
        run: |
          echo "Live Vertex tests are skipped in CI (ADK_HARNESS_LIVE unset)." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud deployment, popup auth, Eventarc provenance, IAM, and Workspace outcomes remain separately authorized live proof; no paid calls run in CI." >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests examples

      - name: Pyright
        run: pyright src

  container:
    name: Cloud Run image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Catch image-only dependency and startup failures.
      - name: Build the image
        run: docker build -t adk-harness-workspace:ci .

      - name: The workspace agent must import inside the image
        run: |
          docker run --rm \
            -e GOOGLE_CLOUD_PROJECT=ci-placeholder \
            adk-harness-workspace:ci \
            python -c "
          import sys
          sys.path.insert(0, '/app/agents')
          from workspace.agent import app
          print('app:', app.name)
          assert app.plugins, 'the governance plugin must be attached'
          from adk_harness.cloud.entrypoints import receiver_entrypoint, worker_main
          assert callable(receiver_entrypoint) and callable(worker_main)
          print('image-smoke-ok')
          "
