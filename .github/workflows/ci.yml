name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  distributions:
    name: Wheel and sdist installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build both distributions and check contents
        run: |
          python -m pip install build pytest pytest-asyncio uv
          python -m build
          python tests/check_distribution.py dist/*
      - name: Install the wheel and check the bundled plugin outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python - <<'PY'
          from mcp.server.fastmcp import FastMCP
          from adk_harness.cli.main import _plugin_source, main
          source = _plugin_source()
          assert source is not None and (source / "mcp_config.json").is_file()
          print("wheel-plugin-and-mcp-ok")
          PY
          adk-harness setup --help
          adk-harness doctor --help
      - name: Verify packed npm install and MCP transport
        env:
          ADK_HARNESS_INSTALL_TEST: "1"
        run: python -m pytest tests/installation -q

  # Keep vendor extras absent to test graceful discovery failures.
  base-install:
    name: Base install, no harness present
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the base package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Importing an adapter must not require its vendor
        run: |
          python - <<'PY'
          import asyncio

          from adk_harness.coding.adapters import (
              AntigravityHarness,
              ClaudeCodeHarness,
              CodexHarness,
          )

          async def main() -> None:
              for harness in (CodexHarness(), ClaudeCodeHarness(), AntigravityHarness()):
                  spec = await harness.discover()
                  assert spec.available is False, f"{spec.id} should be absent on a runner"
                  assert spec.detail, f"{spec.id} must say why it is unavailable"
                  print(f"{spec.id}: unavailable, detail={spec.detail!r}")

          asyncio.run(main())
          print("degrades-cleanly-ok")
          PY
        continue-on-error: false

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install with dev and all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,tracing]"

      # Live tests require credentials and explicit opt-in.
      - name: Run the offline suite
        run: pytest -q

      - name: Say which tests did not run
        if: always()
        run: |
          echo "Live Vertex tests are skipped in CI (ADK_HARNESS_LIVE unset)." >> "$GITHUB_STEP_SUMMARY"
          echo "Live model and Workspace checks require separate credentials and explicit opt-in." >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,tracing]"

      - name: Ruff
        run: ruff check src tests

      - name: Pyright
        run: pyright src

  container:
    name: Cloud Run image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Catch image-only dependency and startup failures.
      - name: Build the image
        run: docker build -t adk-harness-fleet:ci .

      - name: The fleet must import inside the image
        run: |
          docker run --rm \
            -e GOOGLE_CLOUD_PROJECT=ci-placeholder \
            adk-harness-fleet:ci \
            python -c "
          import sys
          sys.path.insert(0, '/app/agents')
          from fleet.agent import app, fleet
          print('app:', app.name)
          print('harnesses:', [(s.id, s.available) for s in fleet.specs])
          assert app.plugins, 'the governance plugin must be attached'
          print('image-smoke-ok')
          "
