name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The claim this package makes is that a harness you have not installed
  # degrades to `available=False` rather than breaking the import. A CI runner
  # has no codex binary, no claude binary and no opencode server, so it is the
  # honest place to check that — and it only checks it if the optional extras
  # are genuinely absent. Keep this job dependency-free on purpose.
  base-install:
    name: Base install, no harness present
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the base package only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Importing an adapter must not require its vendor
        run: |
          python - <<'PY'
          import asyncio

          from adk_harness.adapters import ClaudeCodeHarness, CodexHarness

          async def main() -> None:
              for harness in (CodexHarness(), ClaudeCodeHarness()):
                  spec = await harness.discover()
                  assert spec.available is False, f"{spec.id} should be absent on a runner"
                  assert spec.detail, f"{spec.id} must say why it is unavailable"
                  print(f"{spec.id}: unavailable, detail={spec.detail!r}")

          asyncio.run(main())
          print("degrades-cleanly-ok")
          PY
        continue-on-error: false

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with dev and all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,tracing]"

      # ADK_HARNESS_LIVE is deliberately unset. The live tests call Vertex and
      # cost money, and CI has no credentials — they skip, and the summary below
      # says so out loud rather than letting 4 silent skips look like coverage.
      - name: Run the offline suite
        run: pytest -q

      - name: Say which tests did not run
        if: always()
        run: |
          echo "Live Vertex tests are skipped in CI (ADK_HARNESS_LIVE unset)." >> "$GITHUB_STEP_SUMMARY"
          echo "They are run locally against project model-creek-506520-u4 before release." >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all,tracing]"

      - name: Ruff
        run: ruff check src tests

      - name: Pyright
        run: pyright src

  container:
    name: Cloud Run image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The deployed demo is the project's main piece of evidence, and its image
      # has broken twice in ways the test suite could not see: a Python version
      # the package refuses to install on, and a missing OpenTelemetry exporter
      # that only surfaced at container start. Building it here catches both
      # without waiting for a Cloud Build round trip.
      - name: Build the image
        run: docker build -t adk-harness-fleet:ci .

      - name: The fleet must import inside the image
        run: |
          docker run --rm \
            -e GOOGLE_CLOUD_PROJECT=ci-placeholder \
            adk-harness-fleet:ci \
            python -c "
          import sys
          sys.path.insert(0, '/app/agents')
          from fleet.agent import app, fleet
          print('app:', app.name)
          print('harnesses:', [(s.id, s.available) for s in fleet.specs])
          assert app.plugins, 'the governance plugin must be attached'
          print('image-smoke-ok')
          "
