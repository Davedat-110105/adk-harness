[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-harness"
version = "0.1.0"
description = "Turn any coding-agent harness into a governed Google ADK agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["adk", "gemini", "agents", "claude-code", "codex", "opencode", "antigravity"]
dependencies = [
    "google-adk[db]>=2.7,<3",
    # Bounded deliberately, and widened only after testing. coactra is pre-1.0
    # alpha and ships breaking changes without shims — 0.6.0 renamed
    # coactra.agent.adapters to coactra.agent.backends — so an unbounded pin
    # means a coactra release could break `pip install adk-harness` without a
    # line changing here. The floor is 0.6.0 because that is what has been
    # verified: offline suite, lint, types, and the live Vertex tests all pass
    # against it. Widen the ceiling the same way, not in anticipation.
    "coactra>=0.7.0,<0.8",
]

[project.scripts]
adk-harness = "adk_harness.setup_cli:main"

[project.optional-dependencies]
claude-code = ["claude-agent-sdk>=0.2,<1"]
opencode = ["httpx>=0.27"]
# Google Workspace harnesses. Kept optional: the base install must not need
# them, and a machine without them reports available=False rather than failing.
google-workspace = ["google-api-python-client>=2.100", "google-auth>=2.30"]
# Firestore backs the append-only action ledger the PRD requires.
ledger = ["google-cloud-firestore>=2.16"]
# Bounded at the minor, because 0.1.x is an alpha ("Development Status :: 3")
# that ships a compiled localharness binary per platform wheel — the Python
# surface and the wire protocol move together, so a 0.2 is a runtime change and
# not just an API one. The floor is what has been verified: 0.1.14, against
# which the offline suite, lint, and types all pass. Its `mcp<2,>=1.0` pin
# overlaps google-adk's own `mcp>=1.24,<2`, so the two resolve together.
antigravity = ["google-antigravity>=0.1.14,<0.2"]
a2a = ["google-adk[a2a]>=2.7,<3"]
# ADK's --trace_to_cloud imports opentelemetry.exporter.cloud_trace, which lives
# in google-adk's own `all` extra rather than its `gcp` one. Depending on the
# exporter directly keeps the Cloud Run image small.
tracing = ["opentelemetry-exporter-gcp-trace>=1.9,<2"]
all = ["claude-agent-sdk>=0.2,<1", "httpx>=0.27", "google-antigravity>=0.1.14,<0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_harness"]
# The plugin ships inside the package so `adk-harness setup` can install it
# without the user having cloned the repository.
force-include = { "plugin" = "adk_harness/plugin" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot change what CI enforces underneath us.
select = ["E", "F", "I", "UP", "B", "C4", "RET", "RUF", "PL"]
ignore = [
    # Contract rule 2 requires adapters to import their vendor SDK *inside*
    # discover(), never at module level, so that a missing harness degrades to
    # available=False instead of breaking the import. This rule forbids exactly
    # the thing the architecture requires.
    "PLC0415",
    "PLR0911",  # several early returns is how the policy gate reads best
    "PLR0912",  # the vendor-event mapping is a wide branch by nature
    "PLR0913",  # build_fleet genuinely has many keyword arguments
    "PLR2004",  # comparing against literals is the point of a test
]

[tool.pyright]
# Without this, pyright resolves against the system interpreter and reports
# every third-party import as missing.
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.12"

[tool.ruff.lint.per-file-ignores]
# The module docstring carries a markdown table mapping vendor event tags onto
# HarnessTurn kinds. Wrapping the rows breaks the table, and the table is the
# most useful thing in the file.
"src/adk_harness/adapters/codex.py" = ["E501"]
# These replay real vendor payloads. Reflowing them makes the fixture stop
# looking like what the vendor actually sends, which is the point of it.
"tests/test_adapter_codex.py" = ["E501"]
"tests/test_adapter_claude_code.py" = ["E501"]
# Same reason as codex.py: the module docstring carries the chunk-to-kind table.
"src/adk_harness/adapters/antigravity.py" = ["E501"]
