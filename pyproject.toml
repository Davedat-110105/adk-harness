[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-harness"
version = "0.1.0"
description = "Turn any coding-agent harness into a governed Google ADK agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["adk", "gemini", "agents", "claude-code", "codex", "opencode"]
dependencies = [
    "google-adk[db]>=2.7,<3",
    "coactra>=0.5.0",
]

[project.optional-dependencies]
claude-code = ["claude-agent-sdk>=0.2,<1"]
opencode = ["httpx>=0.27"]
a2a = ["google-adk[a2a]>=2.7,<3"]
all = ["claude-agent-sdk>=0.2,<1", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
