[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-harness"
version = "0.1.0"
description = "Turn any coding-agent harness into a governed Google ADK agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["adk", "gemini", "agents", "claude-code", "codex", "opencode"]
dependencies = [
    "google-adk[db]>=2.7,<3",
    # Upper bound deliberately. coactra is under active refactoring in its own
    # repository — the workflow package was already deleted, and a layer rename
    # is planned — so an unbounded pin means a coactra release could break
    # `pip install adk-harness` for someone installing it tomorrow, without a
    # single line changing here. Widen it after testing against the new release,
    # not before.
    "coactra>=0.5.0,<0.6",
]

[project.optional-dependencies]
claude-code = ["claude-agent-sdk>=0.2,<1"]
opencode = ["httpx>=0.27"]
a2a = ["google-adk[a2a]>=2.7,<3"]
# ADK's --trace_to_cloud imports opentelemetry.exporter.cloud_trace, which lives
# in google-adk's own `all` extra rather than its `gcp` one. Depending on the
# exporter directly keeps the Cloud Run image small.
tracing = ["opentelemetry-exporter-gcp-trace>=1.9,<2"]
all = ["claude-agent-sdk>=0.2,<1", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot change what CI enforces underneath us.
select = ["E", "F", "I", "UP", "B", "C4", "RET", "RUF", "PL"]
ignore = [
    # Contract rule 2 requires adapters to import their vendor SDK *inside*
    # discover(), never at module level, so that a missing harness degrades to
    # available=False instead of breaking the import. This rule forbids exactly
    # the thing the architecture requires.
    "PLC0415",
    "PLR0911",  # several early returns is how the policy gate reads best
    "PLR0912",  # the vendor-event mapping is a wide branch by nature
    "PLR0913",  # build_fleet genuinely has many keyword arguments
    "PLR2004",  # comparing against literals is the point of a test
]

[tool.pyright]
# Without this, pyright resolves against the system interpreter and reports
# every third-party import as missing.
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.12"

[tool.ruff.lint.per-file-ignores]
# The module docstring carries a markdown table mapping vendor event tags onto
# HarnessTurn kinds. Wrapping the rows breaks the table, and the table is the
# most useful thing in the file.
"src/adk_harness/adapters/codex.py" = ["E501"]
# These replay real vendor payloads. Reflowing them makes the fixture stop
# looking like what the vendor actually sends, which is the point of it.
"tests/test_adapter_codex.py" = ["E501"]
"tests/test_adapter_claude_code.py" = ["E501"]
