[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-harness"
version = "0.1.0"
description = "Turn any coding-agent harness into a governed Google ADK agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["adk", "gemini", "agents", "claude-code", "codex", "opencode", "antigravity"]
dependencies = [
    "google-adk[db,mcp]>=2.7,<3",
    # Coactra is pre-1.0; widen this bound only after compatibility testing.
    "coactra>=0.7.0,<0.8",
]

[project.scripts]
adk-harness = "adk_harness.cli.main:main"

[project.optional-dependencies]
claude-code = ["claude-agent-sdk>=0.2,<1"]
opencode = ["httpx>=0.27"]
# Optional API clients; base imports must work without them.
google-workspace = ["google-api-python-client>=2.100", "google-auth>=2.30"]
ledger = ["google-cloud-firestore>=2.16"]
# The SDK bundles a platform runtime; minor upgrades need compatibility testing.
antigravity = ["google-antigravity>=0.1.14,<0.2"]
a2a = ["google-adk[a2a]>=2.7,<3"]
# Required for ADK --trace_to_cloud without its broad all extra.
tracing = ["opentelemetry-exporter-gcp-trace>=1.9,<2"]
# All runtime integrations; developer tooling remains a separate opt-in.
all = ["adk-harness[claude-code,opencode,antigravity,google-workspace,ledger,a2a,tracing]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "pyright>=1.1"]

[tool.hatch.build]
exclude = ["**/.env", "**/.env.*", "**/.adk/**", "**/*.db", "**/*.db-*", "**/__pycache__/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/plugins", "/tests", "/examples", "/docs", "/bin",
    "/.agents/plugins/marketplace.json", "/.npmignore", "/package.json",
    "/README.md", "/LICENSE", "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_harness"]
# Bundle the plugin for setup without a repository checkout.
force-include = { "plugins/antigravity" = "adk_harness/plugins/antigravity" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "RUF", "PL"]
ignore = [
    # Vendor SDK imports must stay lazy.
    "PLC0415",
    "PLR0911",  # several early returns is how the policy gate reads best
    "PLR0912",  # the vendor-event mapping is a wide branch by nature
    "PLR0913",  # build_fleet genuinely has many keyword arguments
    "PLR2004",  # comparing against literals is the point of a test
]

[tool.pyright]
# Match the development interpreter.
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.12"

[tool.ruff.lint.per-file-ignores]
# Preserve long vendor payload lines.
"src/adk_harness/coding/adapters/codex.py" = ["E501"]
"tests/coding/adapters/test_codex.py" = ["E501"]
"tests/coding/adapters/test_claude_code.py" = ["E501"]
"src/adk_harness/coding/adapters/antigravity.py" = ["E501"]
